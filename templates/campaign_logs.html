<!DOCTYPE html>
<html>
<head>
    <title>Campaign Logs</title>
</head>
<body>

<h1>Campaign Logs</h1>

<a href="/admin/fatginger/ui/campaigns">Back</a>

<table border="1" cellpadding="6">
    <tr>
        <th>Customer Phone</th>
        <th>Status</th>
        <th>Sent At</th>
    </tr>

    {% for l in logs %}
    <tr>
        <td>{{ l.customer_phone }}</td>
        <td>{{ l.delivery_status }}</td>
        <td>{{ l.sent_at }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
