<!DOCTYPE html>
<html>
<head>
    <title>FatGinger Campaign Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }

        input, textarea, button {
            width: 100%;
            font-size: 16px;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

<h2>Create & Send Campaign</h2>

<form method="post">
    <label>Title</label>
    <input type="text" name="title" required>

    <label>Message</label>
    <textarea name="message" rows="4" required></textarea>

    <label>Image URL (optional)</label>
    <input type="text" name="image_url">

    <button type="submit">Create & Send</button>
</form>

<hr>

<h2>Previous Campaigns</h2>

<table>
<tr>
    <th>Title</th>
    <th>Status</th>
    <th>Created</th>
</tr>

{% for c in campaigns %}
<tr>
    <td>{{ c.title }}</td>
    <td>{{ c.status }}</td>
    <td>{{ c.created_at }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
