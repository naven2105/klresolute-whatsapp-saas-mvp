<!DOCTYPE html>
<html>
<head>
    <title>FatGinger Campaign Dashboard</title>
</head>
<body>

<h1>FatGinger Campaign Dashboard</h1>

<a href="/admin/fatginger/ui/campaigns/create">Create New Campaign</a>

<table border="1" cellpadding="6">
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Created</th>
        <th>Total Logs</th>
        <th>Actions</th>
    </tr>

    {% for c in campaigns %}
    <tr>
        <td>{{ c.title }}</td>
        <td>{{ c.status }}</td>
        <td>{{ c.created_at }}</td>
        <td>{{ c.total_logs }}</td>
        <td>
            <a href="/admin/fatginger/ui/campaigns/{{ c.id }}/logs">Logs</a>
            <form action="/admin/fatginger/ui/campaigns/{{ c.id }}/send" method="post" style="display:inline;">
                <button type="submit">Send</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
