<!DOCTYPE html>
<html>
<head>
    <title>FatGinger Campaign Dashboard</title>
</head>
<body>

<h2>Create & Send Campaign</h2>

<form method="post">
    <label>Title:</label><br>
    <input type="text" name="title" required><br><br>

    <label>Message:</label><br>
    <textarea name="message" rows="4" required></textarea><br><br>

    <label>Image URL (optional):</label><br>
    <input type="text" name="image_url"><br><br>

    <button type="submit">Create & Send</button>
</form>

<hr>

<h2>Previous Campaigns</h2>

<table border="1" cellpadding="6">
<tr>
    <th>Title</th>
    <th>Status</th>
    <th>Created</th>
</tr>

{% for c in campaigns %}
<tr>
    <td>{{ c.title }}</td>
    <td>{{ c.status }}</td>
    <td>{{ c.created_at }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
